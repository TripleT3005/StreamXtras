<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Stream Overlays – Settings</title>
  <link rel="stylesheet" href="settings.css">
  <script type="module" src="../scripts/settings/main.js"></script>
</head>
<body>
  <header>
    <h1>Stream Overlays</h1>
    <p id="version" class="muted"></p>
  </header>

  <main>
    <section>
      <h2>Twitch account</h2>
      <div id="twitch-account" class="account"></div>
    </section>

    <section>
      <h2>Overlays</h2>
      <p class="muted">Add each overlay to OBS as a browser source with this URL. Leave “Local file” unchecked.</p>
      <ul id="overlay-links" class="links"></ul>
    </section>

    <section>
      <h2>Chat box</h2>
      <div class="editor">
        <form id="chatbox-form" class="editor-form" novalidate>
          <div id="chatbox-fields"></div>
          <div class="actions">
            <button id="chatbox-save" type="submit">Save</button>
            <button id="chatbox-reset" type="button" class="secondary">Reset to defaults</button>
            <p id="chatbox-status" class="status" role="status"></p>
          </div>
        </form>

        <div class="editor-preview">
          <div class="preview-toolbar" role="group" aria-label="Preview background">
            <span class="muted">Preview</span>
            <button type="button" class="chip" data-preview-background="checkered" aria-pressed="true">Checkered</button>
            <button type="button" class="chip" data-preview-background="dark" aria-pressed="false">Dark</button>
            <button type="button" class="chip" data-preview-background="light" aria-pressed="false">Light</button>
            <label class="toggle" title="Shows the real chat of the entered channel instead of sample messages">
              <input id="chatbox-live-preview" type="checkbox">
              Live chat
            </label>
          </div>
          <div id="chatbox-stage" class="preview-stage" data-background="checkered">
            <iframe id="chatbox-preview" title="Chat box preview"></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <a href="../diagnostics/">Diagnostics</a>
  </footer>
</body>
</html>
