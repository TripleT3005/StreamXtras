[package]
name = "stream-overlays"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Companion app for Stream Overlays: serves the overlays and connects them to Twitch"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
