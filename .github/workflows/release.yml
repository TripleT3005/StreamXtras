name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' companion/Cargo.toml | head -n 1)
          package_version=$(jq -r .version package.json)
          if [ -z "$version" ] || [ "$version" != "$package_version" ]; then
            echo "::error::companion/Cargo.toml ($version) and package.json ($package_version) must have the same version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            binary: streamxtras.exe
          - os: ubuntu-latest
            platform: linux-x64
            binary: streamxtras
          - os: macos-latest
            platform: macos-arm64
            binary: streamxtras
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Build overlays
        run: |
          npm ci
          npm run build

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build companion
        working-directory: companion
        shell: bash
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
        run: |
          if [ -z "$TWITCH_CLIENT_ID" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::The repository secret TWITCH_CLIENT_ID is missing; releases need it for the Twitch login"
            exit 1
          fi
          cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          name="streamxtras-${{ needs.version.outputs.version }}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          cp "companion/target/release/${{ matrix.binary }}" "dist/$name/"
          cp -R web "dist/$name/web"
          cp LICENSE README.md "dist/$name/"
          cd dist
          case "${{ runner.os }}" in
            Windows) 7z a -tzip -bso0 "$name.zip" "$name" && archive="$name.zip" ;;
            macOS) ditto -c -k --keepParent "$name" "$name.zip" && archive="$name.zip" ;;
            *) tar -czf "$name.tar.gz" "$name" && archive="$name.tar.gz" ;;
          esac
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: [version, build]
    if: github.event_name != 'pull_request' && needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          prerelease=""
          case "$VERSION" in 0.*) prerelease="--prerelease" ;; esac

          gh release create "$TAG" ./* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes \
            $prerelease

          if [ -z "$VT_API_KEY" ]; then
            exit 0
          fi

          {
            gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body
            echo
            echo "---"
            echo
            echo "### VirusTotal Scan Report"
            echo "Scanned on: $(date -u +%Y-%m-%d)"
            echo
            for archive in *.zip *.tar.gz; do
              [ -e "$archive" ] || continue
              curl --fail --silent --show-error \
                --header "x-apikey: $VT_API_KEY" \
                --form "file=@$archive" \
                https://www.virustotal.com/api/v3/files > /dev/null
              hash=$(cut -d ' ' -f 1 "$archive.sha256")
              echo "- **$archive:** [Scan Report](https://www.virustotal.com/gui/file/$hash)"
            done
          } > notes.md

          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file notes.md
